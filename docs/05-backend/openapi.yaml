openapi: 3.1.0
info:
  title: mi-goTo Lead API
  version: 0.0.0
  description: |
    Documented backend contract revision 2 (API-CONTRACT-R2).
    The official backend semantic version has not been supplied.
    The info.version value 0.0.0 is a non-release compatibility placeholder.
servers:
  - url: "http://localhost:8080"
    description: Local Go backend
  - url: "https://production-url-unresolved.invalid"
    description: Unresolved placeholder; the production base URL has not been supplied.
paths:
  /api/accounts:
    get:
      operationId: listAccounts
      responses:
        "200": { description: Account collection, content: { application/json: { schema: { $ref: '#/components/schemas/AccountListResponse' } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "500": { description: Backend failure, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/accounts/{accountId}:
    get:
      operationId: getAccount
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Account detail, content: { application/json: { schema: { $ref: '#/components/schemas/AccountDetail' } } } }
        "400": { description: Invalid identifier, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "404": { description: Account not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "500": { description: Backend failure, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/accounts/{accountId}/signals:
    get:
      operationId: getAccountSignals
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Account signals, content: { application/json: { schema: { $ref: '#/components/schemas/SignalsResponse' } } } }
        "404": { description: Account not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "500": { description: Backend failure, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/accounts/{accountId}/communication-dna:
    get:
      operationId: getCommunicationDna
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Communication DNA or null, content: { application/json: { schema: { $ref: '#/components/schemas/CommunicationDnaResponse' } } } }
        "404": { description: Account not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "500": { description: Backend failure, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/lead:
    post:
      operationId: submitLead
      summary: Submit a lead
      description: |
        Creates or updates the contact in HubSpot, ensures the company exists,
        associates the contact with the company, sends an internal notification
        email, and returns the HubSpot contact ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadRequest"
            example:
              firstName: John
              familyName: Doe
              company: Example Inc
              workEmail: john@example.com
              context: Optional context
      responses:
        "200":
          description: Lead submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSuccessResponse"
              example:
                message: lead submitted successfully
                hubspot_contact_id: "796484549850"
        "400":
          description: Invalid JSON request body or request validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJson:
                  summary: Invalid JSON request
                  value:
                    error: invalid JSON request body
                validationFailure:
                  summary: Invalid email
                  value:
                    error: workEmail must be valid
        "500":
          description: Unexpected backend failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: internal server error
        "502":
          description: HubSpot processing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: failed to create contact in HubSpot
components:
  schemas:
    AccountListResponse:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/AccountListItem' } } }
    AccountListItem:
      type: object
      required: [id, name, lifecycle, activeSignalCount]
      properties:
        id: { type: string }
        name: { type: string }
        industry: { type: [string, 'null'] }
        hq: { type: [string, 'null'] }
        lifecycle: { type: string }
        analysis: { type: [object, 'null'], additionalProperties: true }
        activeSignalCount: { type: integer }
    AccountDetail:
      allOf: [{ $ref: '#/components/schemas/AccountListItem' }]
      description: Detailed account response including nullable facts and analysis.
    SignalsResponse:
      type: object
      required: [summary, items]
      properties: { summary: { type: object, additionalProperties: true }, items: { type: array, items: { type: object, additionalProperties: true } } }
    CommunicationDnaResponse:
      type: object
      required: [data]
      properties: { data: { type: [object, 'null'], additionalProperties: true } }
    LeadRequest:
      type: object
      required:
        - firstName
        - familyName
        - company
        - workEmail
      properties:
        firstName:
          type: string
          minLength: 1
          description: Required; cannot be empty.
        familyName:
          type: string
          minLength: 1
          description: Required; cannot be empty.
        company:
          type: string
          minLength: 1
          description: Required; cannot be empty.
        workEmail:
          type: string
          format: email
          minLength: 1
          description: Required; cannot be empty and must be a valid email address.
        context:
          type: string
          description: Optional preparation context supplied by the visitor.
    LeadSuccessResponse:
      type: object
      required:
        - message
        - hubspot_contact_id
      properties:
        message:
          type: string
          example: lead submitted successfully
        hubspot_contact_id:
          type: string
          example: "796484549850"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable backend error text; not a stable machine error code.
