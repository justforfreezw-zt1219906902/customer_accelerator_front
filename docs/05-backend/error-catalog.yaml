schema_version: 1
contract_revision: 1
classification_policy:
  backend_error_text_is_stable_machine_code: false
  notes:
    - Match behavior primarily by HTTP status and confirmed contract context.
    - Human-readable backend text may change unless a stable code is later added.
errors:
  - catalog_id: API-LEAD-400-INVALID-JSON
    http_status: 400
    confirmed_example_text: invalid JSON request body
    backend_machine_code: not_specified
    frontend_category: invalid_request
    presentation: recoverable_form_error
    retry: manual_after_user_review
  - catalog_id: API-LEAD-400-VALIDATION
    http_status: 400
    confirmed_example_text: workEmail must be valid
    backend_machine_code: not_specified
    frontend_category: validation_error
    presentation: field_or_form_validation
    retry: after_user_correction
  - catalog_id: API-LEAD-500-INTERNAL
    http_status: 500
    confirmed_example_text: internal server error
    backend_machine_code: not_specified
    frontend_category: server_error
    presentation: generic_temporary_failure
    retry: deliberate_manual_only
  - catalog_id: API-LEAD-502-HUBSPOT
    http_status: 502
    confirmed_example_text: failed to create contact in HubSpot
    backend_machine_code: not_specified
    frontend_category: upstream_service_error
    presentation: generic_integration_failure
    retry: deliberate_manual_only
unknown_error:
  frontend_category: unexpected_response
  presentation: generic_safe_failure
  logging: sanitized_only
  retry: deliberate_manual_only
client_errors:
  - frontend_category: network_error
    presentation: safe_connection_failure
    retry: deliberate_manual_only
  - frontend_category: timeout_error
    presentation: ambiguous_result_warning
    timeout_value: explicitly_deferred_INT-015
    retry: deliberate_manual_only_after_result_check
  - frontend_category: cancelled
    presentation: no_error_after_confirmed_navigation
    notes: Browser cancellation does not prove server-side cancellation.
  - frontend_category: configuration_error
    presentation: safe_contact_by_email_fallback
    retry: after_configuration_correction
