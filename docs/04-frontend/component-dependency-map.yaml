schema_version: 1
dependency_layers:
  tokens: []
  core: [tokens]
  composite: [core]
  product: [core, composite]
  sections: [core, composite, product]
  pages: [sections, composite]
rules:
  cycles_allowed: false
  upward_dependencies_allowed: false
  higher_layer_style_recreation_allowed: false
  page_component_style_duplication_allowed: false
  exceptions_require:
    - architecture_decision
    - human_approval
notes:
  - Pages may use shared layout components classified through an approved architecture decision.
  - Cross-cutting router, content, state, and API boundaries must not bypass layer ownership.

