schema_version: 1
dependency_layers:
  tokens: []
  core: [tokens]
  composite: [core]
  product: [core, composite]
  sections: [core, composite, product]
  pages: [sections, composite]
rules:
  cycles_allowed: false
  upward_dependencies_allowed: false
  higher_layer_style_recreation_allowed: false
  page_component_style_duplication_allowed: false
  exceptions_require:
    - architecture_decision
    - human_approval
notes:
  - AppBrandLogo is a Core component and depends only on tokens and the approved
    local brand asset; Navbar and Footer consume it through the Core layer.
  - Pages may use shared layout components classified through an approved architecture decision.
  - Cross-cutting router, content, state, and API boundaries must not bypass layer ownership.
  - CR-2026-001 approves MarketingLayout and planned ContactLayout as layout-level composition of shared Composite chrome variants.
  - ContactLayout may depend on AppNavbar and AppFooter; ContactPage must not duplicate their markup or styling.
  - Typed Contact variants remain Composite components and may depend only on Core and Tokens.
  - TASK-P4A-003 implements only the shared typed variants; route and ContactLayout selection remain TASK-P6B-003.
  - CR-2026-002 approves WhyLayout as layout-level composition of shared typed Why chrome variants.
  - WhyLayout depends on AppNavbar and AppFooter; WhyMiGotoPage assembles registered Why Sections and does not duplicate chrome.
  - Why Sections depend only on permitted lower layers; the Final CTA reuses AppButton.
