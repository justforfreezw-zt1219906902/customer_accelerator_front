    page: Not Found
    component: NotFoundPage
    planned_path: src/pages/NotFoundPage.vue
    layout: MarketingLayout
    title: Page Not Found | mi-goTo
    figma_page_id: not_applicable_no_figma_source
    implementation_status: temporary_shell_implemented
    anchor_behavior: none
    access_status: public_fallback
    human_approval: approved
    notes:
      - Must be accessible and provide a clear route to /.
      - Final visual design and copy remain separately reviewable.

